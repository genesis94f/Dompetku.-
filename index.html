<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101010"><title>DompetKu — Black & Gold</title>
<style>
:root{--bg:#101010;--panel:#1b1b1b;--panel2:#242424;--yellow:#ffd43b;--text:#f5f5f0;--muted:#aaa99f;--line:#333;--green:#a5d6a7;--red:#ff8a80}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0}.app{max-width:620px;margin:auto;min-height:100dvh;padding-bottom:84px}.top{padding:22px 18px 14px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:23px;font-weight:800}.brand b{color:var(--yellow)}.muted{color:var(--muted);font-size:12px}.content{padding:8px 15px 20px}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:13px}.balance{background:linear-gradient(135deg,#252319,#171717);border:1px solid #66551c}.balance .amount{font-size:30px;font-weight:800;color:var(--yellow);margin:7px 0 18px}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:#ffffff0c;border-radius:12px;padding:11px}.metric strong{display:block;margin-top:5px}.btn{background:var(--yellow);color:#171717;border-radius:12px;padding:12px 15px;font-weight:750}.ghost{background:#302b19;color:var(--yellow);border-radius:10px;padding:9px 12px}.field{width:100%;background:#111;border:1px solid #444;color:var(--text);padding:12px;border-radius:10px;margin-top:6px}.field:focus{outline:1px solid var(--yellow)}.row{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.ico{width:40px;height:40px;background:#332e1a;border-radius:12px;display:grid;place-items:center;font-size:19px}.grow{flex:1;min-width:0}.right{text-align:right}.green{color:var(--green)}.red{color:var(--red)}.tabs{position:fixed;bottom:0;left:0;right:0;background:#171717;border-top:1px solid var(--line);display:flex;justify-content:center;padding:8px max(8px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom));z-index:5}.tabs button{background:none;color:var(--muted);flex:1;font-size:11px;padding:5px 0}.tabs button.active{color:var(--yellow);font-weight:800}.tabs span{display:block;font-size:21px;margin-bottom:3px}.fab{background:var(--yellow)!important;color:#111!important;border-radius:15px!important;font-size:25px!important;max-width:54px;max-height:48px;align-self:center}.sectiontitle{font-weight:800;margin:13px 0 9px}.pill{display:inline-block;background:#302b19;color:var(--yellow);border-radius:30px;padding:7px 11px;font-size:12px}.bar{height:9px;background:#353535;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--yellow);border-radius:9px}.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:flex-end;justify-content:center;z-index:10}.sheet{background:#1b1b1b;border:1px solid #444;border-radius:22px 22px 0 0;width:100%;max-width:620px;max-height:92dvh;overflow:auto;padding:20px 17px 30px}.sheet label{display:block;font-weight:650;font-size:13px;margin:12px 0}.actions{display:flex;gap:12px;font-size:12px;color:var(--muted);justify-content:flex-end;margin-top:4px}.actions button{background:none;color:inherit;padding:0}.hide{display:none!important}h2{font-size:20px;margin:4px 0}.chartrow{display:flex;align-items:center;gap:10px;margin:12px 0}.chartrow .bar{flex:1}.daily{display:flex;align-items:end;gap:4px;height:120px;border-bottom:1px solid #555;padding-top:8px}.daily div{flex:1;background:var(--yellow);border-radius:4px 4px 0 0;min-width:3px;position:relative}.small{font-size:11px;color:var(--muted)}@media(min-width:600px){.tabs{left:50%;right:auto;transform:translateX(-50%);width:620px;border-radius:14px 14px 0 0}}
</style></head><body><div class="app"><header class="top"><div><div class="muted">PERSONAL FINANCE</div><div class="brand">Dompet<b>Ku.</b></div></div><span class="pill">BLACK & GOLD</span></header><main class="content" id="screen"></main><nav class="tabs"><button data-p="home" class="active"> <span>⌂</span>Beranda</button><button data-p="history"><span>▤</span>Riwayat</button><button id="add" class="fab">+</button><button data-p="recap"><span>▥</span>Rekap</button><button data-p="settings"><span>⚙</span>Atur</button></nav></div><div id="modal"></div>
<script>
(()=>{
const $=s=>document.querySelector(s), fmt=n=>'Rp'+Math.abs(n).toLocaleString('id-ID'), iso=d=>{let x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')}, today=iso(new Date()), thisMonth=today.slice(0,7);
const defaults=[['Makanan','expense','🍜'],['Transportasi','expense','🚗'],['Belanja','expense','🛍️'],['Tagihan','expense','🧾'],['Kesehatan','expense','💊'],['Hiburan','expense','🎬'],['Lainnya','expense','📦'],['Gaji','income','💰'],['Lainnya','income','✨']];
let db;try{db=JSON.parse(localStorage.getItem('dompetku_gold'))}catch(e){}
if(!db||!Array.isArray(db.tx)||!Array.isArray(db.cats)){db={cats:defaults.map((x,i)=>({id:'c'+i,name:x[0],type:x[1],icon:x[2]})),tx:[
{ id:'s1',type:'income',amount:7600000,date:today,category:'Gaji',note:'Gaji bulanan',sample:true},
{ id:'s2',type:'expense',amount:35000,date:today,category:'Makanan',note:'Makan siang',sample:true},
{ id:'s3',type:'expense',amount:18000,date:today,category:'Transportasi',note:'Transportasi kantor',sample:true},
{ id:'s4',type:'expense',amount:125000,date:iso(Date.now()-86400000),category:'Belanja',note:'Kebutuhan rumah',sample:true},
{ id:'s5',type:'expense',amount:45000,date:iso(Date.now()-2*86400000),category:'Makanan',note:'Makan malam',sample:true}],sample:true}}
let page='home',month=thisMonth,filters={q:'',from:'',to:'',cat:'all'};
const save=()=>localStorage.setItem('dompetku_gold',JSON.stringify(db)), cat=(n,t)=>db.cats.find(c=>c.name===n&&c.type===t)||{icon:'📦'}, sum=(a,t)=>a.filter(x=>x.type===t).reduce((s,x)=>s+x.amount,0), label=m=>new Date(m+'-01T00:00:00').toLocaleDateString('id-ID',{month:'long',year:'numeric'}), totals=m=>{let a=db.tx.filter(x=>x.date.startsWith(m));return{a,inc:sum(a,'income'),exp:sum(a,'expense')}}, esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function row(t){return `<div class="row"><div class="ico">${cat(t.category,t.type).icon}</div><div class="grow"><b>${esc(t.category)}</b><div class="small">${esc(t.note||'Tanpa catatan')} · ${new Date(t.date+'T00:00:00').toLocaleDateString('id-ID',{day:'numeric',month:'short'})}</div></div><div class="right"><b class="${t.type==='income'?'green':''}">${t.type==='income'?'+':'−'}${fmt(t.amount)}</b><div class="actions"><button onclick="app.edit('${t.id}')">Edit</button><button onclick="app.del('${t.id}')">Hapus</button></div></div></div>`}
function render(){document.querySelectorAll('[data-p]').forEach(b=>b.classList.toggle('active',b.dataset.p===page));if(page==='home')home();if(page==='history')history();if(page==='recap')recap();if(page==='settings')settings()}
function home(){let m=totals(thisMonth),bal=db.tx.reduce((s,t)=>s+(t.type==='income'?1:-1)*t.amount,0),recent=[...db.tx].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);$('#screen').innerHTML=`<section class="card balance"><div class="muted">TOTAL SALDO</div><div class="amount">${fmt(bal)}</div><div class="twocol"><div class="metric"><div class="muted">↗ Pemasukan bulan ini</div><strong class="green">${fmt(m.inc)}</strong></div><div class="metric"><div class="muted">↘ Pengeluaran bulan ini</div><strong>${fmt(m.exp)}</strong></div></div></section><section class="card"><div class="muted">SISA UANG BULAN INI</div><div style="font-size:25px;font-weight:800;color:var(--yellow);margin:5px 0">${fmt(m.inc-m.exp)}</div><div class="small">${label(thisMonth)} · pemasukan dikurangi pengeluaran</div></section><div class="sectiontitle">Transaksi terakhir <button class="ghost" style="float:right" onclick="app.go('history')">Lihat semua →</button></div><section class="card">${recent.length?recent.map(row).join(''):'<p class="muted">Belum ada transaksi.</p>'}</section>`}
function history(){let a=[...db.tx].filter(t=>(!filters.q||(t.note+' '+t.category).toLowerCase().includes(filters.q.toLowerCase()))&&(!filters.from||t.date>=filters.from)&&(!filters.to||t.date<=filters.to)&&(filters.cat==='all'||t.category===filters.cat)).sort((x,y)=>y.date.localeCompare(x.date)),g={};a.forEach(t=>(g[t.date]??=[]).push(t));$('#screen').innerHTML=`<h2>Riwayat transaksi</h2><p class="muted">Cari dan telusuri transaksi keuangan</p><section class="card"><input id="q" class="field" placeholder="Cari catatan atau kategori..." value="${esc(filters.q)}"><div class="twocol"><label class="small">Dari<input id="from" type="date" class="field" value="${filters.from}"></label><label class="small">Sampai<input id="to" type="date" class="field" value="${filters.to}"></label></div><select id="cf" class="field"><option value="all">Semua kategori</option>${db.cats.map(c=>`<option ${filters.cat===c.name?'selected':''}>${esc(c.name)}</option>`).join('')}</select><button class="ghost" id="reset" style="margin-top:10px">Reset filter</button></section><p class="small">${a.length} transaksi ditemukan</p>${Object.entries(g).map(([d,ts])=>`<section class="card"><b>${new Date(d+'T00:00:00').toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</b><span style="float:right">${fmt(sum(ts,'income')-sum(ts,'expense'))}</span>${ts.map(row).join('')}</section>`).join('')||'<section class="card muted">Tidak ada transaksi.</section>'}`;$('#q').oninput=e=>{filters.q=e.target.value;history()};$('#from').onchange=e=>{filters.from=e.target.value;history()};$('#to').onchange=e=>{filters.to=e.target.value;history()};$('#cf').onchange=e=>{filters.cat=e.target.value;history()};$('#reset').onclick=()=>{filters={q:'',from:'',to:'',cat:'all'};history()}}
function recap(){let m=totals(month),d=new Date(month+'-01T00:00:00');d.setMonth(d.getMonth()-1);let pm=iso(d).slice(0,7),p=totals(pm),by={};m.a.filter(t=>t.type==='expense').forEach(t=>by[t.category]=(by[t.category]||0)+t.amount);let cats=Object.entries(by).sort((a,b)=>b[1]-a[1]),max=Math.max(1,...cats.map(x=>x[1])),days={};m.a.filter(t=>t.type==='expense').forEach(t=>days[t.date]=(days[t.date]||0)+t.amount);let daily=Object.entries(days).sort();let dm=Math.max(1,...daily.map(x=>x[1])),change=p.exp?(m.exp-p.exp)/p.exp*100:null;$('#screen').innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center"><div><h2>Rekap bulanan</h2><p class="muted">Pantau pola keuanganmu</p></div><div><button class="ghost" onclick="app.shift(-1)">‹</button> <b>${label(month)}</b> <button class="ghost" onclick="app.shift(1)" ${month>=thisMonth?'disabled':''}>›</button></div></div><div class="twocol"><section class="card"><div class="muted">Pemasukan</div><b class="green">${fmt(m.inc)}</b></section><section class="card"><div class="muted">Pengeluaran</div><b>${fmt(m.exp)}</b></section></div><section class="card"><div class="muted">Sisa uang</div><b style="font-size:24px;color:var(--yellow)">${fmt(m.inc-m.exp)}</b></section><section class="card"><b>Pengeluaran per kategori</b>${cats.map(([n,v])=>`<div class="chartrow"><span style="width:100px;font-size:12px">${cat(n,'expense').icon} ${esc(n)}</span><div class="bar"><i style="width:${v/max*100}%"></i></div><b style="font-size:12px">${fmt(v)}</b></div>`).join('')||'<p class="muted">Belum ada data pengeluaran.</p>'}</section><section class="card"><b>Pengeluaran harian</b><div class="daily">${daily.map(([date,v])=>`<div title="${date}: ${fmt(v)}" style="height:${Math.max(3,v/dm*100)}%"></div>`).join('')}</div><div class="small" style="margin-top:8px">Setiap batang mewakili satu tanggal. Rincian:</div>${daily.map(([date,v])=>`<div class="row" style="font-size:12px"><span class="grow">${new Date(date+'T00:00:00').toLocaleDateString('id-ID',{day:'numeric',month:'short'})}</span><b>${fmt(v)}</b></div>`).join('')||'<p class="muted">Belum ada data harian.</p>'}</section><section class="card"><b>Dibanding bulan sebelumnya</b><p class="muted">${label(pm)}</p><b>${fmt(p.exp)}</b><p class="muted">Pengeluaran bulan ini</p><b>${fmt(m.exp)}</b><p class="${change===null?'muted':change>0?'red':'green'}">${change===null?'Belum ada data pembanding':(change>0?'Naik ':'Turun ')+Math.abs(change).toFixed(1)+'% dibanding bulan lalu'}</p></section>`}
function settings(){ $('#screen').innerHTML=`<h2>Pengaturan</h2><p class="muted">Kelola kategori dan data keuangan</p><section class="card"><div style="display:flex;justify-content:space-between"><b>Kategori</b><button class="ghost" onclick="app.catForm()">+ Tambah</button></div>${['income','expense'].map(type=>`<p class="muted" style="margin-top:15px">${type==='income'?'PEMASUKAN':'PENGELUARAN'}</p>${db.cats.filter(c=>c.type===type).map(c=>`<div class="row"><span>${c.icon}</span><span class="grow">${esc(c.name)}</span><button class="ghost" onclick="app.catForm('${c.id}')">Edit</button><button class="ghost" onclick="app.delCat('${c.id}')">Hapus</button></div>`).join('')}`).join('')}</section><section class="card"><b>Data contoh</b><p class="muted">Hapus transaksi contoh tanpa menghapus transaksi pribadi.</p><button class="ghost" onclick="app.clearSamples()">Hapus data contoh</button></section><section class="card"><b>Cadangan data</b><p class="muted">Ekspor atau pulihkan file JSON.</p><button class="ghost" onclick="app.export()">↓ Ekspor JSON</button><label class="muted">Pulihkan file JSON<input id="import" type="file" accept=".json" class="field"></label></section>`;$('#import').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x.tx)||!Array.isArray(x.cats))throw 0;if(confirm('Ganti data saat ini dengan cadangan?')){db=x;save();render()}}catch(e){alert('File tidak valid')}};r.readAsText(f)}}
function close(){$('#modal').innerHTML=''}
function form(id){let t=db.tx.find(x=>x.id===id),type=t?.type||'expense';$('#modal').innerHTML=`<div class="modal" onclick="if(event.target===this)app.close()"><div class="sheet"><div style="display:flex;justify-content:space-between"><h2>${t?'Edit':'Tambah'} transaksi</h2><button class="ghost" onclick="app.close()">✕</button></div><div class="twocol" style="margin:15px 0"><button class="ghost" id="inc">↗ Pemasukan</button><button class="ghost" id="exp">↘ Pengeluaran</button></div><form id="txform"><input id="type" type="hidden" value="${type}"><label>Nominal (Rp)<input id="amt" class="field" type="number" min="1" step="1" required value="${t?.amount||''}" placeholder="50000"></label><label>Tanggal<input id="date" class="field" type="date" required value="${t?.date||today}"></label><label>Kategori<select id="category" class="field">${db.cats.filter(c=>c.type===type).map(c=>`<option ${t?.category===c.name?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label><label>Catatan<input id="note" class="field" maxlength="100" value="${esc(t?.note||'')}" placeholder="Catatan singkat"></label><button class="btn" style="width:100%;margin-top:12px">${t?'Simpan perubahan':'Simpan transaksi'}</button></form></div></div>`;function set(v){type=v;$('#type').value=v;$('#category').innerHTML=db.cats.filter(c=>c.type===v).map(c=>`<option>${esc(c.name)}</option>`).join('')}$('#inc').onclick=()=>set('income');$('#exp').onclick=()=>set('expense');$('#txform').onsubmit=e=>{e.preventDefault();let amount=Number($('#amt').value);if(!Number.isSafeInteger(amount)||amount<=0)return alert('Nominal tidak valid');let item={id:t?.id||'t'+Date.now(),type,amount,date:$('#date').value,category:$('#category').value,note:$('#note').value.trim()};if(t)db.tx=db.tx.map(x=>x.id===t.id?item:x);else db.tx.push(item);save();close();render()}}
function catForm(id){let c=db.cats.find(x=>x.id===id);$('#modal').innerHTML=`<div class="modal" onclick="if(event.target===this)app.close()"><div class="sheet"><h2>${c?'Edit':'Tambah'} kategori</h2><form id="cfm"><label>Jenis<select id="typ" class="field" ${c?'disabled':''}><option value="expense" ${c?.type==='expense'?'selected':''}>Pengeluaran</option><option value="income" ${c?.type==='income'?'selected':''}>Pemasukan</option></select></label><label>Nama<input id="nm" class="field" required maxlength="30" value="${esc(c?.name||'')}"></label><label>Emoji<input id="em" class="field" maxlength="8" value="${c?.icon||'📌'}"></label><button class="btn" style="width:100%">Simpan</button></form></div></div>`;$('#cfm').onsubmit=e=>{e.preventDefault();let name=$('#nm').value.trim(),typ=$('#typ').value;if(db.cats.some(x=>x.type===typ&&x.name.toLowerCase()===name.toLowerCase()&&x.id!==id))return alert('Kategori sudah ada');if(c){let old=c.name;c.name=name;c.icon=$('#em').value||'📌';db.tx.forEach(t=>{if(t.category===old&&t.type===c.type)t.category=name})}else db.cats.push({id:'c'+Date.now(),name,type:typ,icon:$('#em').value||'📌'});save();close();render()}}
function del(id){let t=db.tx.find(x=>x.id===id);if(t&&confirm('Hapus transaksi '+fmt(t.amount)+'?')){db.tx=db.tx.filter(x=>x.id!==id);save();render()}}
function delCat(id){let c=db.cats.find(x=>x.id===id);if(db.tx.some(t=>t.category===c.name&&t.type===c.type))return alert('Kategori masih digunakan transaksi.');if(confirm('Hapus kategori '+c.name+'?')){db.cats=db.cats.filter(x=>x.id!==id);save();render()}}
function clearSamples(){let n=db.tx.filter(t=>t.sample).length;if(!n)return alert('Tidak ada data contoh.');if(confirm('Hapus '+n+' transaksi contoh?')){db.tx=db.tx.filter(t=>!t.sample);save();render()}}
function shift(n){let d=new Date(month+'-01T00:00:00');d.setMonth(d.getMonth()+n);let m=iso(d).slice(0,7);if(m<=thisMonth){month=m;render()}}
function exportData(){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.href=u;a.download='dompetku-backup.json';a.click();URL.revokeObjectURL(u)}
const app={go:p=>{page=p;render()},edit:form,del,close,catForm,delCat,clearSamples,shift,export:exportData};window.app=app;
document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>app.go(b.dataset.p));$('#add').onclick=()=>form();save();render();
})();
</script></body></html>
